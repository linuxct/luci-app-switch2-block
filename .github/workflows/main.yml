name: Build and Release LuCI Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '安装包版本号（例如 1.0.0，留空则使用 Makefile 默认值）'
        required: false
        type: string
      release_tag:
        description: '可选：填入已有 Release 的标签名（如 1.0.0），填了会自动上传附件到该 Release'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.format }} (${{ matrix.sdk_ver }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - sdk_ver: "23.05.5"
            format: "ipk"
          - sdk_ver: "25.12.6"
            format: "apk"

    steps:
      - name: Checkout plugin code
        uses: actions/checkout@v4
        with:
          path: luci-app-switch2-block

      - name: Cache OpenWrt SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: sdk
          key: openwrt-sdk-v1-${{ matrix.sdk_ver }}

      - name: Download and setup SDK (Skipped if cached)
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        env:
          VER: ${{ matrix.sdk_ver }}
        run: |
          HOST="downloads.openwrt.org"
          PATH_DIR="releases/${VER}/targets/x86/64/"
          SDK_URL="https://${HOST}/${PATH_DIR}"
          SDK_FILE=$(curl -sL "$SDK_URL" | grep -oE "openwrt-sdk-${VER}-x86-64_gcc-[^\"']+\.tar\.(xz|zst)" | head -n 1)
          echo "Downloading ${SDK_URL}${SDK_FILE}..."
          wget -q "${SDK_URL}${SDK_FILE}"
          mkdir -p sdk
          tar -xf "$SDK_FILE" -C sdk --strip-components=1
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Set package version and compile
        env:
          INPUT_VER: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          rm -rf sdk/package/luci-app-switch2-block
          cp -r luci-app-switch2-block sdk/package/
          
          TARGET_VER="$INPUT_VER"
          if [ -z "$TARGET_VER" ] && [ "$REF_TYPE" = "tag" ]; then
            TARGET_VER="${REF_NAME#v}"
          fi
          
          if [ -n "$TARGET_VER" ]; then
            echo "Setting PKG_VERSION to $TARGET_VER"
            sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${TARGET_VER}/g" sdk/package/luci-app-switch2-block/Makefile
          fi

          cd sdk
          make defconfig
          make package/luci-app-switch2-block/compile V=s

      - name: Collect built packages
        env:
          PACKAGE_FORMAT: ${{ matrix.format }}
        run: |
          mkdir -p release_files
          find sdk/bin/packages/ -type f -name "*switch2-block*.${PACKAGE_FORMAT}" -exec cp {} release_files/ \;
          ls -lh release_files/

      - name: Sign and verify APKs
        if: matrix.format == 'apk'
        env:
          APK_SIGNING_PRIVATE_KEY: ${{ secrets.APK_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${APK_SIGNING_PRIVATE_KEY:?Configure the APK_SIGNING_PRIVATE_KEY Actions secret}"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          umask 077
          printf '%s\n' "$APK_SIGNING_PRIVATE_KEY" > "$work/signing.pem"
          unset APK_SIGNING_PRIVATE_KEY

          public_key=luci-app-switch2-block-apk.pem
          openssl pkey -in "$work/signing.pem" -pubout -out "$work/derived.pem"
          cmp -s "$work/derived.pem" "luci-app-switch2-block/$public_key" || {
            echo "Signing secret does not match the published public key" >&2
            exit 1
          }
          mkdir "$work/keys"
          cp "luci-app-switch2-block/$public_key" "$work/keys/$public_key"

          shopt -s nullglob
          apks=(release_files/*.apk)
          ((${#apks[@]})) || { echo "No APKs to sign" >&2; exit 1; }
          apk=sdk/staging_dir/host/bin/apk
          # apk-tools 3.0.5 only adds a signature to the first file per invocation.
          for package in "${apks[@]}"; do
            "$apk" adbsign --allow-untrusted --reset-signatures --sign-key "$work/signing.pem" "$package"
          done
          "$apk" --keys-dir "$work/keys" verify "${apks[@]}"
          cp "luci-app-switch2-block/$public_key" release_files/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.format }}
          if-no-files-found: error
          path: release_files/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_packages
          merge-multiple: true

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: all_packages/*
