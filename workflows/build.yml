name: Build and Release LuCI Package

on:
  push:
    tags:
      - 'v*' # 当推送类似 v1.0.0 的标签时自动编译并发布
  workflow_dispatch: # 也支持在 GitHub 网页端手动点击运行测试

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.format }} (${{ matrix.sdk_ver }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # 使用 23.05 SDK 编译传统的 .ipk 安装包（兼容 LEDE 及 19.xx~23.xx）
          - sdk_ver: "23.05.5"
            format: "ipk"
          # 使用 24.10 SDK 编译新版 .apk 安装包（兼容 24.10+ 及后续版本）
          - sdk_ver: "24.10.0"
            format: "apk"

    steps:
      - name: Checkout plugin code
        uses: actions/checkout@v4
        with:
          path: luci-app-switch2-block

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget curl

      - name: Download and extract OpenWrt SDK
        run: |
          SDK_URL="https://openwrt.org{{ matrix.sdk_ver }}/targets/x86/64/"
          SDK_FILE=$(curl -sL "$SDK_URL" | grep -oE "openwrt-sdk-${{ matrix.sdk_ver }}-x86-64_gcc-[^\"']+\.tar\.(xz|zst)" | head -n 1)
          echo "Downloading $SDK_FILE..."
          wget -q "${SDK_URL}${SDK_FILE}"
          tar -xf "$SDK_FILE"
          mv openwrt-sdk-* sdk

      - name: Prepare feeds and package
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp -r ../luci-app-switch2-block package/
          make defconfig

      - name: Compile package
        run: |
          cd sdk
          make package/luci-app-switch2-block/compile V=s

      - name: Collect built packages
        run: |
          mkdir -p release_files
          find sdk/bin/packages/ -type f \( -name "*switch2-block*.ipk" -o -name "*switch2-block*.apk" \) -exec cp {} release_files/ \;
          ls -lh release_files/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.format }}
          path: release_files/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_packages
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: all_packages/*
          generate_release_notes: true
